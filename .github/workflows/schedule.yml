name: Daily Job Scraper

on:
  schedule:
    - cron: '0 * * * *' # Runs hourly
  workflow_dispatch: # Allows manual trigger

jobs:
  scrape-jobs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install chromium
        playwright install-deps

    - name: Run Scraper Pipeline
      env:
        SMTP_SERVER: smtp.gmail.com
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        OPENAI_BASE_URL: https://api.groq.com/openai/v1
        OPENAI_MODEL: llama-3.3-70b-versatile
      run: |
        # Run just the pipeline once, not the infinite schedule loop
        python -c "from job_hunter.scheduler.main_job import run_pipeline; run_pipeline()"

    - name: Commit and push changes (data export)
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add data/
        git commit -m "Automated daily scrape update" || echo "No changes to commit"
        git push
